[package]
name = "qcc"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["QCC Authors"]
description = "Quantum Circuit Compiler (QCC) — a Rust-first quantum circuit compiler and simulator"
repository = "https://github.com/000jitendra000/QCC_Quantum_Circuit_Compiler"
readme = "README.md"
license = "Apache-2.0 OR MIT"
keywords = ["quantum", "compiler", "qcc", "circuit", "simulator"]
categories = ["compilers", "science"]

[dependencies]
num-complex = "0.4"
petgraph = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
